<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Renfo Running</title>
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,sans-serif}header{background:#111827;color:white;padding:18px}h1{margin:0}main{max-width:760px;margin:auto;padding:12px 12px 90px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex}nav button{flex:1;padding:10px 2px;border:0;background:none;font-size:11px}.card{background:white;border:1px solid #e5e7eb;border-radius:15px;padding:14px;margin:10px 0}button{background:#2563eb;color:white;border:0;border-radius:9px;padding:10px 13px;font-weight:700}button.green{background:#16a34a}button.red{background:#fee2e2;color:#991b1b}button.secondary{background:#eef2ff;color:#1e40af}input,select,textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}label{font-size:12px;color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.hidden{display:none}.muted{color:#667085;font-size:12px}.badge{display:inline-block;background:#f1f5f9;padding:5px 7px;border-radius:7px;margin:2px;font-size:11px}.set{display:grid;grid-template-columns:38px 1fr 1fr 55px;gap:5px;margin-top:7px}.done{background:#dcfce7!important;color:#166534!important}
</style></head><body><header><h1>Renfo Running</h1><div class="muted">Carnet de renforcement évolutif</div></header><main>
<section id="home"><h2>Accueil</h2><div class="card"><h3>Créer ta séance</h3><p class="muted">Choisis tes exercices et règle séries, reps, temps, charge et repos.</p><button onclick="go('builder')">📝 Construire</button></div><div class="card"><b>Dernière séance</b><div id="last" class="muted">Aucune.</div></div></section>
<section id="builder" class="hidden"><div class="row"><h2>Nouvelle séance</h2><button onclick="savePlan()">💾 Enregistrer</button></div><div class="card grid"><label>Nom<input id="pname" value="Séance renfo"></label><label>Objectif<select id="goal"><option>Force</option><option>Course à pied</option><option>Prévention / stabilité</option><option>Hypertrophie</option><option>Récupération</option><option>Mixte</option></select></label></div><div class="card"><div class="row"><b>Ajouter un exercice</b><button class="secondary" onclick="customEx()">➕ Nouveau</button></div><select id="pick"></select><button style="width:100%;margin-top:8px" onclick="add()">Ajouter</button></div><div id="plan"></div><button class="green" style="width:100%" onclick="start()">▶️ Démarrer</button></section>
<section id="workout" class="hidden"><div class="row"><h2 id="wt">Séance</h2><button class="green" onclick="finish()">Terminer</button></div><div id="wl"></div><div class="card"><h3>Ressenti</h3><div class="grid"><label>Pied /10<input id="foot" type="number" min="0" max="10" value="0"></label><label>Cheville /10<input id="ankle" type="number" min="0" max="10" value="0"></label><label>Hanche /10<input id="hip" type="number" min="0" max="10" value="0"></label><label>Fatigue /10<input id="fatigue" type="number" min="0" max="10" value="0"></label></div><label>Commentaire<textarea id="note" rows="3"></textarea></label></div><div class="card"><h3>🤖 Analyse de séance</h3><button class="green" style="width:100%" onclick="makeSummary()">Générer le résumé</button><textarea id="summary" rows="15" readonly></textarea><div class="grid"><button class="secondary" onclick="copy()">📋 Copier</button><button class="secondary" onclick="share()">📤 Partager</button></div></div></section>
<section id="library" class="hidden"><h2>Bibliothèque</h2><div id="lib"></div></section><section id="history" class="hidden"><h2>Historique</h2><div id="hist"></div></section><section id="progress" class="hidden"><h2>Progression</h2><div id="prog"></div></section>
</main><nav><button onclick="go('home')">🏠<br>Accueil</button><button onclick="go('builder')">📝<br>Séance</button><button onclick="go('library');renderLib()">🏋️<br>Exercices</button><button onclick="go('history');renderHist()">📋<br>Historique</button><button onclick="go('progress');renderProg()">📈<br>Progression</button></nav>
<script>
const LIB={"Jambes": ["Squat", "Front squat", "Goblet squat", "Split squat", "Bulgarian split squat", "Fentes avant", "Fentes arrière", "Fentes marchées", "Step-up", "Step-down", "Presse à cuisses", "Hack squat", "Wall sit", "Spanish squat", "Soulevé de terre", "RDL", "Soulevé de terre jambes tendues", "Good morning", "Hip thrust", "Glute bridge", "Glute bridge une jambe", "Extension de hanche poulie", "Leg extension", "Leg curl assis", "Leg curl couché", "Nordic curl", "Reverse Nordic curl", "Copenhagen plank"], "Mollets / pied": ["Mollets debout", "Mollets assis", "Mollets une jambe", "Mollets sur marche", "Tibialis raises", "Flexion dorsale élastique", "Inversion du pied élastique", "Éversion du pied élastique", "Short foot", "Toe yoga", "Équilibre une jambe"], "Fessiers / hanches": ["Abduction élastique", "Abduction poulie", "Clamshell", "Monster walk", "Lateral band walk", "Fire hydrant", "Donkey kick", "Hip airplane", "Single-leg RDL", "Banded glute bridge"], "Gainage / tronc": ["Planche", "Planche latérale", "Planche latérale avec abduction", "Dead bug", "Bird dog", "Hollow body hold", "Crunch", "Crunch lesté", "Reverse crunch", "Pallof press", "Suitcase carry", "Farmer carry", "Bear crawl", "Mountain climber", "Russian twist", "Back extension"], "Haut du corps": ["Pompes", "Pompes inclinées", "Développé couché", "Développé incliné haltères", "Rowing haltère", "Rowing poulie", "Tirage vertical", "Tractions", "Tractions assistées", "Face pull", "Élévations latérales", "Développé épaules", "Curl biceps", "Extension triceps poulie", "Dips assistés"], "Mobilité": ["Mobilité cheville genou au mur", "Étirement soléaire", "Étirement gastrocnémien", "Rotation thoracique", "90/90 hanches", "Étirement fléchisseur de hanche"]};let custom=JSON.parse(localStorage.getItem('rr_custom')||'[]'),plan=[],w=[],session=null;
const all=()=>Object.values(LIB).flat().concat(custom),data=()=>JSON.parse(localStorage.getItem('rr_hist')||'[]');
function go(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='builder')fillPick()}
function fillPick(){let s=document.getElementById('pick');s.innerHTML='';Object.entries(LIB).forEach(([c,a])=>{let g=document.createElement('optgroup');g.label=c;a.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;g.appendChild(o)});s.appendChild(g)});if(custom.length){let g=document.createElement('optgroup');g.label='Mes exercices';custom.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;g.appendChild(o)});s.appendChild(g)}}
function customEx(){let n=prompt('Nom de l’exercice');if(n&&!all().includes(n)){custom.push(n);localStorage.setItem('rr_custom',JSON.stringify(custom));fillPick();pick.value=n;add()}}
function add(){plan.push({name:pick.value,sets:3,mode:'reps',reps:10,sec:30,load:0,rest:90});renderPlan()}
function renderPlan(){planEl=document.getElementById('plan');planEl.innerHTML='';plan.forEach((x,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="row"><b>${x.name}</b><button class="red" onclick="plan.splice(${i},1);renderPlan()">Supprimer</button></div><div class="grid"><label>Séries<input type="number" value="${x.sets}" onchange="plan[${i}].sets=+this.value"></label><label>Type<select onchange="plan[${i}].mode=this.value;renderPlan()"><option value="reps" ${x.mode==='reps'?'selected':''}>Répétitions</option><option value="time" ${x.mode==='time'?'selected':''}>Temps</option></select></label><label>${x.mode==='reps'?'Reps':'Secondes'}<input type="number" value="${x.mode==='reps'?x.reps:x.sec}" onchange="plan[${i}].${x.mode==='reps'?'reps':'sec'}=+this.value"></label><label>Charge kg<input type="number" step=".5" value="${x.load}" onchange="plan[${i}].load=+this.value"></label><label>Repos sec<input type="number" value="${x.rest}" onchange="plan[${i}].rest=+this.value"></label></div>`;planEl.appendChild(d)})}
function savePlan(){localStorage.setItem('rr_plan',JSON.stringify(plan));alert('Séance enregistrée')}
function start(){if(!plan.length)return alert('Ajoute un exercice');session={name:pname.value,goal:goal.value,items:JSON.parse(JSON.stringify(plan)),date:new Date().toISOString()};w=plan.map(x=>({...x,done:Array(x.sets).fill(false)}));wt.textContent=session.name;renderW();go('workout')}
function renderW(){wl.innerHTML='';w.forEach((x,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${x.name}</h3><span class="muted">${x.sets} × ${x.mode==='reps'?x.reps:x.sec+' sec'} · ${x.load?x.load+' kg':'poids du corps'} · repos ${x.rest}s</span>${x.done.map((v,j)=>`<div class="set"><button class="${v?'done':''}" onclick="w[${i}].done[${j}]=!w[${i}].done[${j}];renderW()">S${j+1}</button><input id="v${i}_${j}" type="number" value="${x.mode==='reps'?x.reps:x.sec}"><input id="l${i}_${j}" type="number" value="${x.load}"><button class="secondary" onclick="count(${x.rest})">⏱</button></div>`).join('')}`;wl.appendChild(d)})}
function count(s){let end=Date.now()+s*1000;let t=setInterval(()=>{let r=Math.ceil((end-Date.now())/1000);document.title='Repos '+Math.max(0,r)+'s';if(r<=0){clearInterval(t);document.title='Renfo Running';alert('Repos terminé')}},250)}
function finish(){let done=w.reduce((a,x)=>a+x.done.filter(Boolean).length,0),total=w.reduce((a,x)=>a+x.sets,0);if(!done)return alert('Coche au moins une série');session={...session,done,total,foot:+foot.value||0,ankle:+ankle.value||0,hip:+hip.value||0,fatigue:+fatigue.value||0,note:note.value,items:w.map((x,i)=>({...x,actual:x.done.map((v,j)=>({done:v,value:+document.getElementById('v'+i+'_'+j).value||0,load:+document.getElementById('l'+i+'_'+j).value||0}))}))};let d=data();d.unshift(session);localStorage.setItem('rr_hist',JSON.stringify(d));makeSummary();last.textContent=new Date(session.date).toLocaleString('fr-FR')+' — '+done+'/'+total+' séries'}
function makeSummary(){if(!session)return;summary.value=[`🏋️ ${session.name} — ${new Date(session.date).toLocaleDateString('fr-FR')}`,`Objectif : ${session.goal}`,``,`Séries : ${session.done}/${session.total}`,``,...session.items.map(x=>`• ${x.name} — ${x.actual.filter(a=>a.done).map(a=>(x.mode==='reps'?a.value+' reps':a.value+' sec')+(a.load?' @ '+a.load+' kg':'')).join(', ')||'aucune'}`),``,`🦶 Pied : ${session.foot}/10`,`🦵 Cheville : ${session.ankle}/10`,`🦵 Hanche : ${session.hip}/10`,`😴 Fatigue : ${session.fatigue}/10`,``,`📝 ${session.note||'Aucun commentaire'}`].join('\n')}
async function copy(){await navigator.clipboard.writeText(summary.value);alert('Résumé copié')}
async function share(){if(navigator.share)try{await navigator.share({title:'Analyse de séance',text:summary.value})}catch(e){}else copy()}
function renderLib(){libEl=document.getElementById('lib');libEl.innerHTML='';Object.entries(LIB).forEach(([c,a])=>{let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+c+'</h3>'+a.map(x=>'<span class="badge">'+x+'</span>').join('');libEl.appendChild(d)})}
function renderHist(){let d=data();hist.innerHTML=d.length?d.map(x=>`<div class="card"><b>${x.name}</b><div class="muted">${new Date(x.date).toLocaleString('fr-FR')} · ${x.done}/${x.total} séries · pied ${x.foot}/10 · fatigue ${x.fatigue}/10</div></div>`).join(''):'<div class="card">Aucune séance.</div>'}
function renderProg(){let d=data(),names=[...new Set(d.flatMap(x=>x.items.map(y=>y.name)))];prog.innerHTML=names.map(n=>{let v=d.flatMap(s=>s.items.filter(x=>x.name===n).flatMap(x=>x.actual.filter(a=>a.done).map(a=>a.load))).filter(Boolean);return '<div class="card"><b>'+n+'</b><div class="muted">Meilleure charge : '+(v.length?Math.max(...v)+' kg':'—')+'</div></div>'}).join('')||'<div class="card">Pas encore de données.</div>'}
fillPick();renderPlan();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
